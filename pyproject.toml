[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dating-news-digest"
version = "0.1.0"
description = "Weekly product news intelligence for a dating MVP"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
dating-digest = "dating_digest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
